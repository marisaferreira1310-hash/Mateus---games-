<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Marvel: A Última Joia</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d1a;color:#fff;font-family:system-ui,Arial;display:flex;align-items:center;justify-content:center;min-height:100vh}#wrap{width:min(100vw,960px);padding:8px}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#121c36;border:2px solid #55caff;border-radius:8px;touch-action:none}.bar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:6px 0}.pill{background:#172743;border:1px solid #3c78a5;border-radius:9px;padding:7px 10px;font-size:14px}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:8px;touch-action:none}.pad,.actions{display:flex;gap:7px;align-items:center}.btn{border:2px solid #6bcfff;background:#14294a;color:white;border-radius:15px;min-width:52px;height:52px;font-size:19px;font-weight:800;box-shadow:0 3px 0 #071323;touch-action:none}.btn:active{transform:translateY(2px);background:#235486}.small{font-size:12px;color:#bcd7f4;text-align:center;margin-top:6px}button:focus{outline:2px solid white}
</style></head><body><div id="wrap"><div class="bar"><div class="pill"><b>🕷️ MARVEL: A ÚLTIMA JOIA</b></div><div class="pill" id="phase">Cena inicial</div><div class="pill" id="timer">02:00</div></div><canvas id="game" width="960" height="540" aria-label="Jogo de luta 2D"></canvas><div class="controls"><div class="pad"><button class="btn" data-key="left">◀</button><button class="btn" data-key="right">▶</button><button class="btn" data-key="jump">⬆</button></div><div class="actions"><button class="btn" data-key="dodge">◇</button><button class="btn" data-key="kick">○</button><button class="btn" data-key="upper">△</button><button class="btn" data-key="punch">✕</button></div></div><div class="small">Celular: use os botões. Computador: ← → mover, ↑ pular, X soco, C chute, Z esquiva, A golpe forte. Toque na tela para avançar a abertura.</div></div>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),phaseEl=document.getElementById('phase'),timerEl=document.getElementById('timer');let mode='title',titleTime=10,intro=0,remaining=60,finalTime=0,last=0,keys={},player={x:230,y:400,vx:0,vy:0,hp:100,face:1,attack:0,dodge:0},boss={x:720,y:400,hp:250,attack:0,flash:0},message='',msgTime=0,ended=false;const W=960,H=540;function keyAct(k){if(k==='left')keys.left=true;if(k==='right')keys.right=true;if(k==='jump'&&player.y>=400)player.vy=-480;if(['punch','kick','upper'].includes(k)&&mode==='fight'){player.attack=0.22;let dist=Math.abs(player.x-boss.x);if(dist<155){boss.hp=Math.max(0,boss.hp-(k==='upper'?15:k==='kick'?11:9));boss.flash=.18;}}if(k==='dodge')player.dodge=.35;if(k==='start'){mode='fight'}}
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='left'||k==='right'){keys[k]=true}else keyAct(k)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));});window.addEventListener('keydown',e=>{let map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',x:'punch',X:'punch',c:'kick',C:'kick',a:'upper',A:'upper',z:'dodge',Z:'dodge',Enter:'start',' ':'start'};let k=map[e.key];if(k){e.preventDefault();if(!keys['key_'+e.key])keyAct(k);keys['key_'+e.key]=true}});window.addEventListener('keyup',e=>{keys['key_'+e.key]=false;let map={ArrowLeft:'left',ArrowRight:'right'};if(map[e.key])keys[map[e.key]]=false});c.addEventListener('pointerdown',()=>{if(mode==='intro'&&intro>4)intro=10});
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}function text(t,x,y,size=24,color='white',align='left'){ctx.fillStyle=color;ctx.font=`bold ${size}px system-ui,Arial`;ctx.textAlign=align;ctx.fillText(t,x,y)}function background(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171c42');g.addColorStop(.58,'#f07852');g.addColorStop(1,'#141b2d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<17;i++){let x=i*62;let hh=90+(i*47%180);rect(x,320-hh,48,hh,'#182338');for(let j=0;j<4;j++)for(let k=0;k<3;k++)if((i+j+k)%3)rect(x+7+j*10,330-hh+k*24,4,8,'#f7b56a')}rect(0,420,W,120,'#242735');ctx.strokeStyle='#53576b';ctx.lineWidth=2;for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(i*140,420);ctx.lineTo(i*140+60,540);ctx.stroke()}}
function hero(x,y,kind,scale=1,flip=1,flash=false){ctx.save();ctx.translate(x,y);ctx.scale(scale*flip,scale);let isP=kind==='spider',isV=kind==='vision';let main=isP?'#e52e3d':isV?'#25a85a':'#4537a3',trim=isP?'#153f86':isV?'#d5a53c':'#dca83a';if(flash)main='#fff';// legs
rect(-27,-52,20,54,main);rect(7,-52,20,54,main);rect(-31,-5,28,12,trim);rect(4,-5,28,12,trim);// torso
rect(-32,-112,64,64,main);rect(-36,-105,72,10,trim);rect(-48,-105,18,52,main);rect(30,-105,18,52,main);// head
ctx.fillStyle=main;ctx.beginPath();ctx.arc(0,-132,29,0,Math.PI*2);ctx.fill();ctx.fillStyle=trim;ctx.fillRect(-24,-151,48,5);if(isV){ctx.fillStyle='#d6a438';ctx.fillRect(-24,-150,48,8);ctx.fillStyle='#ffdf45';ctx.beginPath();ctx.moveTo(0,-149);ctx.lineTo(8,-135);ctx.lineTo(0,-121);ctx.lineTo(-8,-135);ctx.closePath();ctx.fill();ctx.fillStyle='#f6f0d4';ctx.fillRect(-19,-138,10,4);ctx.fillRect(9,-138,10,4);ctx.fillStyle='#d5a53c';ctx.fillRect(-7,-111,14,9)}else if(isP){ctx.strokeStyle='#101b37';ctx.lineWidth=2;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*8,-157);ctx.lineTo(i*8,-108);ctx.stroke()}ctx.fillStyle='white';ctx.beginPath();ctx.ellipse(-11,-134,7,10,-.25,0,Math.PI*2);ctx.ellipse(11,-134,7,10,.25,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#ffcf44';ctx.fillRect(-7,-146,14,22);ctx.fillStyle='#ffdd55';ctx.beginPath();ctx.arc(0,-133,5,0,Math.PI*2);ctx.fill()}// arm
rect(22,-98,46,15,main);rect(59,-99,17,18,trim);ctx.restore()}
function bars(){text('HOMEM-ARANHA',40,34,18);rect(40,45,300,18,'#432e42');rect(40,45,300*player.hp/100,18,'#3ee47c');text('THANOS',620,34,18);rect(620,45,300,18,'#432e42');rect(620,45,300*boss.hp/250,18,'#f34c4c');}
function introDraw(){background();hero(310,448,'spider',1.2,-1);if(intro<5){text('NOVA YORK ESTÁ EM RUÍNAS...',480,95,28,'#fff','center');text('O Homem-Aranha observa a cidade destruída.',480,132,18,'#fff','center')}else if(intro<10){hero(735,448,'thanos',1.25,-1);text('THANOS: EU QUERO A JOIA DA MENTE!',480,95,25,'#ffe28b','center')}else {hero(735,448,'thanos',1.25,-1);text('HOMEM-ARANHA: SE QUER A JOIA,',480,86,25,'white','center');text('TEM QUE PASSAR POR MIM!',480,120,25,'white','center');text('TOQUE NA TELA OU PRESSIONE ENTER',480,495,17,'#8ee7ff','center')}text('CENA INICIAL',30,35,18,'#8ee7ff');}
function fightDraw(){background();hero(player.x,player.y,'spider',1,player.face,player.attack>0);hero(boss.x,boss.y,'thanos',1,-1,boss.flash>0);bars();text('DERROTE THANOS!',480,90,22,'#fff','center');if(player.attack>0)text('POW!',player.x+player.face*60,player.y-155,25,'#ffe45b','center');if(player.dodge>0)text('ESQUIVA!',player.x,player.y-180,16,'#8ee7ff','center');}
function endingDraw(win){background();if(win){hero(420,430,'spider',1.2,1);hero(520,430,'vision',1.2,-1);text('O VISÃO ABRAÇA O HOMEM-ARANHA!',480,120,25,'#fff','center');text('VOCÊ PROTEGEU A JOIA DA MENTE!',480,160,21,'#a4ffbd','center')}else{hero(480,430,'thanos',1.4,-1);text('THANOS CONSEGUIU A JOIA!',480,100,28,'#ffe28b','center');text('ESTALA OS DEDOS... METADE DO UNIVERSO DESAPARECE.',480,145,18,'white','center')}text('END',480,300,54,'#8ee7ff','center');text('TOQUE OU ENTER PARA JOGAR DE NOVO',480,500,17,'white','center')}
function update(dt){if(mode==='title'){titleTime-=dt;if(titleTime<=0){mode='intro';intro=0;phaseEl.textContent='Cena inicial'}}else if(mode==='intro'){intro+=dt;if(intro>=30){mode='fight';phaseEl.textContent='Batalha';}}else if(mode==='fight'){remaining-=dt;player.vx=0;if(keys.left){player.vx=-260;player.face=-1}if(keys.right){player.vx=260;player.face=1}player.x=Math.max(50,Math.min(910,player.x+player.vx*dt));player.vy+=1000*dt;player.y=Math.min(400,player.y+player.vy*dt);if(player.y>=400)player.vy=0;player.attack=Math.max(0,player.attack-dt);player.dodge=Math.max(0,player.dodge-dt);boss.flash=Math.max(0,boss.flash-dt);boss.attack-=dt;if(boss.attack<=0){boss.attack=1.0+Math.random()*1.1;if(Math.abs(player.x-boss.x)<190&&player.dodge<=0)player.hp=Math.max(0,player.hp-8)}if(boss.hp<=0){mode='win';finalTime=0;phaseEl.textContent='Vitória!'}else if(player.hp<=0||remaining<=0){mode='lose';phaseEl.textContent='Derrota'} }else{finalTime+=dt;if(finalTime>30){finalTime=0;mode='title';phaseEl.textContent='Fim';}}}
function draw(){if(mode==='intro')introDraw();else if(mode==='fight')fightDraw();else if(mode==='win')endingDraw(true);else if(mode==='lose')endingDraw(false);else{background();hero(330,430,'spider',1.2,1);hero(660,430,'thanos',1.2,-1);text('MARVEL: A ÚLTIMA JOIA',480,145,42,'#fff','center');text('HOMEM-ARANHA VS. THANOS',480,195,25,'#8ee7ff','center');text('A AVENTURA COMEÇA EM',480,290,20,'white','center');text(Math.max(0,Math.ceil(titleTime))+' segundos',480,330,30,'#ffe28b','center')}let t=mode==='title'?Math.max(0,titleTime):mode==='intro'?Math.max(0,30-intro):mode==='fight'?remaining:mode==='win'||mode==='lose'?Math.max(0,30-finalTime):0;timerEl.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');}
function loop(ts){let dt=Math.min(.04,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(mode==='title'||mode==='win'||mode==='lose')){player={x:230,y:400,vx:0,vy:0,hp:100,face:1,attack:0,dodge:0};boss={x:720,y:400,hp:250,attack:0,flash:0};remaining=60;intro=0;titleTime=10;mode='title';phaseEl.textContent='Tela inicial'}else if(e.key==='Enter'&&mode==='intro'&&intro>=4){intro=10}});c.addEventListener('pointerdown',()=>{if(mode==='title'||mode==='win'||mode==='lose'){player={x:230,y:400,vx:0,vy:0,hp:100,face:1,attack:0,dodge:0};boss={x:720,y:400,hp:250,attack:0,flash:0};remaining=60;intro=0;titleTime=10;mode='title';phaseEl.textContent='Tela inicial'}});requestAnimationFrame(loop)})();
</script></body></html>
